# Gera o app do iPhone num Mac do GitHub e envia ao TestFlight.
# Roda sozinho a cada push na main (o mesmo push que publica o site) e envia o que estiver na main.
# Também dá para rodar à mão: GitHub → Actions → "iOS → TestFlight" → Run workflow.
# Precisa dos segredos (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID e ASC_KEY_P8 (conteúdo do arquivo .p8 da chave de API do App Store Connect, acesso Admin).
# Opcional, evita o erro "máximo de certificados": IOS_DEV_CERT_P12_BASE64 (o .p12 do certificado "Apple Development" exportado do Mac, em base64) e IOS_DEV_CERT_PASSWORD (a senha do .p12).
#   Com eles, todo build reaproveita o mesmo certificado em vez de pedir um novo à Apple. Sem eles, o fluxo funciona como antes.
# Não envia para revisão da loja: o build só aparece no TestFlight.
name: iOS → TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VITE_API_URL: https://api.askout.com.br
      # Chave do Google Maps (de navegador, restrita por site no Google Cloud). Cadastrar em GitHub → Settings → Secrets and variables → Actions → Variables.
      VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
      TEAM_ID: 359NDWACC5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Escolher o Xcode mais novo
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site e copiar para o iOS
        working-directory: apps/mobile
        run: npm run build:web && npx cap sync ios

      - name: Chave da API da Apple
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Certificado de desenvolvimento fixo (opcional)
        env:
          P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then echo "Sem certificado fixo: o Xcode cria um (pode bater no limite da Apple)."; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dev.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dev.p12"
          security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Número do build
        # Sempre maior que o último enviado à mão (13) e que os envios anteriores deste fluxo.
        run: echo "BUILD_NUMBER=$((13 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Arquivar (Archive)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Enviar ao App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          echo "Build $BUILD_NUMBER enviado. Aparece no TestFlight em 10 a 30 minutos." >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar a chave
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
