# Gera o app do iPhone num Mac do GitHub e envia ao TestFlight.
# Roda sozinho a cada push na main (o mesmo push que publica o site) e envia o que estiver na main.
# Também dá para rodar à mão: GitHub → Actions → "iOS → TestFlight" → Run workflow.
# Precisa dos segredos (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID e ASC_KEY_P8 (conteúdo do arquivo .p8 da chave de API do App Store Connect, acesso Admin).
# Certificado fixo (obrigatório): todo build usa SEMPRE o mesmo .p12, nunca pede um novo à Apple.
#   De onde vem o .p12, nesta ordem:
#     1. segredo IOS_DEV_CERT_P12_BASE64 (o .p12 em base64), ou
#     2. o arquivo no repositório indicado pela variável IOS_DEV_CERT_P12_PATH (padrão: apps/mobile/ios/certs/askout.p12).
#   A senha vem sempre do segredo IOS_DEV_CERT_PASSWORD (nunca do código).
#   Se não achar o .p12, ou ele não tiver um certificado de assinatura válido, o build para com erro.
#   O Archive é assinado só com esse certificado (assinatura manual, perfil criado pela API); o Xcode não cria certificado.
# Não envia para revisão da loja: o build só aparece no TestFlight.
name: iOS → TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VITE_API_URL: https://api.askout.com.br
      # Chave do Google Maps (de navegador, restrita por site no Google Cloud). Cadastrar em GitHub → Settings → Secrets and variables → Actions → Variables.
      VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
      TEAM_ID: 359NDWACC5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Escolher o Xcode mais novo
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site e copiar para o iOS
        working-directory: apps/mobile
        run: npm run build:web && npx cap sync ios

      - name: Chave da API da Apple
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Certificado fixo (sempre o mesmo .p12)
        env:
          P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
          P12_PATH: ${{ vars.IOS_DEV_CERT_P12_PATH || 'apps/mobile/ios/certs/askout.p12' }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/cert.p12"
          if [ -n "$P12_BASE64" ]; then
            echo "Usando o .p12 do segredo IOS_DEV_CERT_P12_BASE64."
            echo "$P12_BASE64" | base64 --decode > "$P12"
          elif [ -f "$P12_PATH" ]; then
            echo "Usando o .p12 do repositório: $P12_PATH"
            cp "$P12_PATH" "$P12"
          else
            echo "::error::Certificado .p12 não encontrado (nem no segredo IOS_DEV_CERT_P12_BASE64, nem em $P12_PATH). O build não cria outro certificado."
            exit 1
          fi
          if [ -z "$P12_PASSWORD" ]; then
            echo "::warning::Segredo IOS_DEV_CERT_PASSWORD vazio: tentando importar o .p12 sem senha."
          fi
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          IDS="$(security find-identity -v -p codesigning "$KC")"
          echo "$IDS" | sed 's/[0-9A-F]\{40\}/<hash>/'
          if ! echo "$IDS" | grep -q '[1-9][0-9]* valid identities found'; then
            echo "::error::O .p12 não tem um certificado de assinatura válido (expirado, revogado ou sem a chave privada)."
            exit 1
          fi
          # Número de série do certificado (para achar o mesmo certificado na conta da Apple).
          HASH="$(echo "$IDS" | awk 'NR==1{print $2}')"
          SERIAL="$(security find-certificate -a -Z -p "$KC" | awk -v h="$HASH" '/^SHA-1 hash:/{on=($3==h)} on' | sed -n '/BEGIN CERT/,/END CERT/p' | openssl x509 -noout -serial | cut -d= -f2)"
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"

      - name: Perfil de desenvolvimento com o certificado fixo
        # Cria o perfil na Apple já com o certificado do .p12, para o Xcode não criar outro certificado.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node .github/scripts/ios-dev-profile.mjs

      - name: Assinatura manual no build (só no CI)
        # No Mac de vocês o projeto continua com assinatura automática; aqui o Release do app passa a usar
        # o certificado fixo e o perfil acima. O aps-environment vai como development no Archive
        # (perfil de desenvolvimento); no envio à loja o Xcode troca para production.
        working-directory: apps/mobile/ios/App
        run: |
          python3 - <<'PY'
          import os, re
          p = 'App.xcodeproj/project.pbxproj'
          s = open(p).read()
          i = s.index('504EC3181FED79650016851F /* Release */ = {')
          j = s.index('name = Release;', i)
          block = s[i:j]
          assert 'CODE_SIGN_STYLE = Automatic;' in block, 'bloco Release do app não encontrado'
          block = block.replace('CODE_SIGN_STYLE = Automatic;',
            'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Development";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";' % os.environ['PROFILE_NAME'])
          open(p, 'w').write(s[:i] + block + s[j:])
          e = 'App/App.entitlements'
          t = open(e).read()
          open(e, 'w').write(re.sub(r'(<key>aps-environment</key>\s*<string>)production(</string>)', r'\1development\2', t))
          PY

      - name: Número do build
        # Sempre maior que o último enviado à mão (13) e que os envios anteriores deste fluxo.
        run: echo "BUILD_NUMBER=$((13 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Arquivar (Archive)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Enviar ao App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          echo "Build $BUILD_NUMBER enviado. Aparece no TestFlight em 10 a 30 minutos." >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar builds antigas do TestFlight (a cada 10 builds)
        # Quando o número da build é múltiplo de 10, expira todas menos as 10 mais novas.
        if: success()
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ $((BUILD_NUMBER % 10)) -eq 0 ]; then node .github/scripts/expire-testflight-builds.mjs; else echo "Build $BUILD_NUMBER: sem limpeza (só nos múltiplos de 10)."; fi

      - name: Apagar a chave
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
